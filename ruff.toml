# Legacy codebase — ignore style-only issues.
# Keep: bare except (E722), syntax errors (E999), undefined names (F821)

[lint]
ignore = [
    "F401",   # unused import
    "F403",   # star imports
    "F405",   # undefined from star import
    "F541",   # f-string without placeholders
    "F811",   # redefined function/import
    "F841",   # unused variable
    "E402",   # import not at top
    "E722",   # bare except (legacy, risky to change)
]
